<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8F3F0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="NUVARIS: an offline climate resilience companion with a 3D buddy guide.">
<title>NUVARIS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<style>*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
:root{
  --font: ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN","Nunito","Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px);
  --top-h:58px;--nav-h:66px;
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  /* light tokens */
  --bg:#E8F3F0;--bg2:#D7EAE5;--ink:#0B2A30;--ink2:#41626A;--ink3:#6A8A8C;
  --line:rgba(11,60,62,.12);--line2:rgba(11,60,62,.2);
  --glass:rgba(255,255,255,.66);--glass2:rgba(250,255,254,.92);--solid:#F7FCFB;
  --track:rgba(11,60,62,.12);--accent:#0AA383;--accent2:#2A7FE0;--accent-ink:#fff;
  --shadow:0 12px 34px rgba(16,70,72,.14);--shadow2:0 22px 60px rgba(10,50,55,.22);
  --aur1:rgba(46,201,160,.30);--aur2:rgba(66,150,255,.22);--aur3:rgba(255,140,90,.16);
  --dot:rgba(11,60,62,.09);--scrim:rgba(4,20,24,.48);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#04161B;--bg2:#08232A;--ink:#E4F8F4;--ink2:#9DC2BE;--ink3:#6F9592;
  --line:rgba(150,255,230,.11);--line2:rgba(150,255,230,.2);
  --glass:rgba(14,44,52,.6);--glass2:rgba(12,38,45,.94);--solid:#0B2A31;
  --track:rgba(150,255,230,.13);--accent:#45EBC3;--accent2:#58C3FF;--accent-ink:#03221B;
  --shadow:0 14px 40px rgba(0,0,0,.4);--shadow2:0 26px 70px rgba(0,0,0,.55);
  --aur1:rgba(40,230,180,.18);--aur2:rgba(70,140,255,.18);--aur3:rgba(255,120,80,.10);
  --dot:rgba(150,255,230,.06);--scrim:rgba(0,8,10,.62);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#04161B;--bg2:#08232A;--ink:#E4F8F4;--ink2:#9DC2BE;--ink3:#6F9592;
  --line:rgba(150,255,230,.11);--line2:rgba(150,255,230,.2);
  --glass:rgba(14,44,52,.6);--glass2:rgba(12,38,45,.94);--solid:#0B2A31;
  --track:rgba(150,255,230,.13);--accent:#45EBC3;--accent2:#58C3FF;--accent-ink:#03221B;
  --shadow:0 14px 40px rgba(0,0,0,.4);--shadow2:0 26px 70px rgba(0,0,0,.55);
  --aur1:rgba(40,230,180,.18);--aur2:rgba(70,140,255,.18);--aur3:rgba(255,120,80,.10);
  --dot:rgba(150,255,230,.06);--scrim:rgba(0,8,10,.62);color-scheme:dark;}

body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation;
  transition:background-color .4s var(--ease),color .4s var(--ease)}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;-webkit-user-select:none;user-select:none}
:focus{outline:none}
:focus-visible{outline:2.5px solid var(--accent2);outline-offset:2px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ambient background */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bgfx::before{content:"";position:absolute;inset:-20%;
  background:radial-gradient(40% 35% at 15% 10%,var(--aur1),transparent 70%),
  radial-gradient(35% 30% at 90% 20%,var(--aur2),transparent 70%),
  radial-gradient(40% 35% at 70% 100%,var(--aur3),transparent 70%)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px);
  background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 75%);mask-image:linear-gradient(180deg,#000,transparent 75%)}

/* ---------- app shell: mobile portrait default ---------- */
.app{position:fixed;inset:0;z-index:1;display:grid;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:calc(var(--top-h) + var(--st)) minmax(0,1fr) calc(var(--nav-h) + var(--sb));
  grid-template-areas:"top" "main" "nav"}
.topbar{grid-area:top;display:flex;align-items:center;gap:10px;min-width:0;
  padding:var(--st) max(14px,var(--sr)) 0 max(16px,var(--sl));
  background:linear-gradient(180deg,var(--bg) 30%,transparent);position:relative;z-index:5}
.top-title{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.top-title .ti{width:34px;height:34px;flex:0 0 34px;border-radius:11px;display:grid;place-items:center;color:var(--c,var(--accent));background:var(--c20,rgba(10,163,131,.14))}
.top-title .ti svg{width:20px;height:20px}
.top-title h1{font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-actions{display:flex;gap:6px;flex:0 0 auto}
.icon-btn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);
  color:var(--ink);transition:transform .25s var(--spring),background .3s,border-color .3s;position:relative}
.icon-btn svg{width:20px;height:20px}
.icon-btn:hover{border-color:var(--line2)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.lang{width:auto;min-width:42px;padding:0 10px;font-weight:800;font-size:14px;gap:6px;display:inline-flex;align-items:center}
.icon-btn.lang svg{width:18px;height:18px}
.icon-btn[aria-pressed="false"] .slash{display:block}

.nav{grid-area:nav;display:flex;align-items:stretch;gap:2px;padding:6px max(6px,var(--sr)) var(--sb) max(6px,var(--sl));
  background:var(--glass2);border-top:1px solid var(--line);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);z-index:6}
.brand,.nav-foot{display:none}
.nav-items{display:flex;flex:1;gap:2px;min-width:0}
.nav-item{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;
  color:var(--ink3);font-size:10.5px;font-weight:750;letter-spacing:.01em;padding:4px 0;transition:color .25s}
.nav-item .ni{width:44px;height:30px;border-radius:12px;display:grid;place-items:center;transition:background .3s var(--ease),transform .35s var(--spring)}
.nav-item .ni svg{width:22px;height:22px}
.nav-item .nl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.nav-item .nl-full{display:none}
.nav-item[aria-current="page"]{color:var(--ink)}
.nav-item[aria-current="page"] .ni{background:var(--c20);color:var(--c);transform:translateY(-1px)}
.nav-item:active .ni{transform:scale(.88)}

.main{grid-area:main;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;scroll-behavior:smooth}
.view{max-width:1180px;margin:0 auto;padding:10px max(16px,var(--sr)) 140px max(16px,var(--sl));}
.view.enter{animation:viewIn .42s var(--ease) both}
@keyframes viewIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- mobile landscape ---------- */
@media (orientation:landscape) and (max-height:540px){
  :root{--top-h:50px}
  .app{grid-template-columns:calc(78px + var(--sl)) minmax(0,1fr);grid-template-rows:calc(var(--top-h) + var(--st)) minmax(0,1fr);
    grid-template-areas:"nav top" "nav main"}
  .nav{flex-direction:column;padding:calc(var(--st) + 8px) 6px calc(var(--sb) + 8px) calc(6px + var(--sl));border-top:0;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav-items{flex-direction:column;flex:0 0 auto;gap:2px}
  .nav-item{flex:0 0 auto;min-height:46px;font-size:10px;gap:1px}
  .nav-item .ni{height:28px;width:42px}
  .topbar{padding-left:14px}
  .icon-btn{width:38px;height:38px;border-radius:12px}
  .icon-btn.lang{min-width:38px}
  .top-title .ti{width:30px;height:30px;flex-basis:30px}
  .top-title h1{font-size:16px}
  .view{padding:6px max(16px,calc(var(--sr) + 8px)) 110px 16px}
}
/* ---------- desktop / tablet landscape ---------- */
@media (min-width:960px) and (min-height:541px){
  :root{--top-h:76px}
  .app{grid-template-columns:272px minmax(0,1fr);grid-template-rows:var(--top-h) minmax(0,1fr);grid-template-areas:"nav top" "nav main"}
  .nav{flex-direction:column;padding:22px 16px 18px;border-top:0;border-right:1px solid var(--line);gap:18px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 6px}
  .brand-mark{width:42px;height:42px;border-radius:14px;background:conic-gradient(from 200deg,#2FCB7A,#2EA7FF,#9B8CF0,#FF7B4A,#F2B336,#2FCB7A);display:grid;place-items:center;box-shadow:0 8px 22px rgba(46,167,255,.3)}
  .brand-mark span{width:20px;height:20px;border-radius:50%;background:var(--solid)}
  .brand b{display:block;font-size:20px;font-weight:850;letter-spacing:-.02em}
  .brand small{display:block;font-size:12.5px;color:var(--ink3);font-weight:600}
  .nav-items{flex-direction:column;flex:0 0 auto;gap:4px}
  .nav-item{flex-direction:row;justify-content:flex-start;gap:12px;padding:8px 10px;font-size:14.5px;font-weight:700;min-height:50px;text-align:left}
  .nav-item:hover{background:var(--glass)}
  .nav-item .ni{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:var(--glass)}
  .nav-item .nl{display:none}
  .nav-item .nl-full{display:block;white-space:normal;line-height:1.2;overflow:hidden}
  .nav-item[aria-current="page"]{background:var(--glass)}
  .nav-foot{display:block;margin-top:auto;font-size:12px;color:var(--ink3);padding:0 10px;line-height:1.5}
  .topbar{padding:0 32px;background:none}
  .top-title h1{font-size:22px}
  .top-title .ti{width:40px;height:40px;flex-basis:40px;border-radius:13px}
  .icon-btn{width:44px;height:44px}
  .view{padding:8px 40px 160px}
}

/* ---------- generic components ---------- */
.panel{background:var(--glass);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow)}
.panel h3{font-size:17px;font-weight:800;letter-spacing:-.01em;margin-bottom:4px}
.panel .sub{font-size:13.5px;color:var(--ink2);line-height:1.45}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:15px;font-weight:800;font-size:15px;
  transition:transform .25s var(--spring),box-shadow .3s,opacity .3s;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 10px 26px rgba(42,127,224,.28)}
.btn.ghost{background:var(--glass);border:1px solid var(--line2)}
.btn.danger{background:rgba(229,72,122,.12);color:#E5487A;border:1px solid rgba(229,72,122,.35)}
.btn:active{transform:scale(.95)}
.btn.sm{min-height:38px;padding:0 14px;font-size:13.5px;border-radius:12px}
.chip{min-height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);font-weight:750;font-size:13.5px;background:transparent;
  transition:background .25s,color .25s,border-color .25s,transform .25s var(--spring);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--mc,var(--accent));border-color:transparent;color:#fff}
.chip:active{transform:scale(.94)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg{display:inline-flex;padding:4px;border-radius:16px;background:var(--glass);border:1px solid var(--line);gap:2px;max-width:100%}
.seg button{min-height:40px;padding:0 16px;border-radius:12px;font-weight:800;font-size:14px;color:var(--ink2);transition:background .3s var(--ease),color .3s;white-space:nowrap}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--solid);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.08)}
.field{display:flex;flex-direction:column;gap:6px;padding:8px 0}
.field-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.field label,.field .lbl{font-size:14px;font-weight:750;color:var(--ink2)}
.field output{font-size:16px;font-weight:850;font-variant-numeric:tabular-nums;color:var(--ink);white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;--pct:50%;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--mc,var(--accent)) var(--pct),var(--track) var(--pct))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--mc,var(--accent));margin-top:-10px;box-shadow:0 4px 12px rgba(0,0,0,.2);transition:transform .2s var(--spring)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:99px;background:var(--mc,var(--accent))}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--mc,var(--accent))}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.row .lbl{font-size:15px;font-weight:700}
.row .hint{font-size:12.5px;color:var(--ink3);font-weight:600;margin-top:2px;line-height:1.35}
.switch{width:52px;height:32px;flex:0 0 52px;border-radius:99px;background:var(--track);position:relative;transition:background .3s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .35s var(--spring)}
.switch[aria-checked="true"]{background:var(--mc,var(--accent))}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.stepper{display:inline-flex;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:3px}
.stepper button{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;font-weight:800}
.stepper button:active{background:var(--track)}
.stepper button:disabled{opacity:.35}
.stepper output{min-width:34px;text-align:center;font-weight:850;font-size:17px;font-variant-numeric:tabular-nums}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}
.ring .bgc{stroke:var(--track)}
.ring .fgc{transition:stroke-dashoffset .9s var(--ease)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;align-items:center;margin-bottom:14px}
.hero-stage{position:relative;height:230px;touch-action:none}
.hero-stage::before{content:"";position:absolute;left:50%;bottom:4%;width:min(64%,260px);height:26px;transform:translateX(-50%);border-radius:50%;
  background:radial-gradient(closest-side,rgba(69,235,195,.35),transparent);filter:blur(2px)}
.slot canvas{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.slot{position:relative}
.stage-hint{position:absolute;left:50%;bottom:0;transform:translateX(-50%);font-size:12px;color:var(--ink3);font-weight:700;white-space:nowrap;pointer-events:none}
.hello{font-size:15px;font-weight:800;color:var(--accent);margin-bottom:6px}
.hero-h{font-size:clamp(30px,8.4vw,58px);font-weight:900;line-height:1.02;letter-spacing:-.035em;max-width:16ch;text-wrap:balance}
.hero-p{margin-top:12px;font-size:16px;line-height:1.5;color:var(--ink2);max-width:46ch}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
@media (min-width:720px){
  .hero{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:24px;margin:10px 0 24px}
  .hero-stage{order:2;height:360px}
  .hero-h{font-size:clamp(36px,4.8vw,62px)}
}
@media (orientation:landscape) and (max-height:540px){
  .hero{grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:12px}
  .hero-stage{order:2;height:230px}
  .hero-h{font-size:30px}
  .hero-p{font-size:14.5px;margin-top:8px}
  .hero-actions{margin-top:12px}
}
.ready{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;margin-bottom:22px}
.ready .rv{position:relative;width:92px;height:92px}
.ready .rv b{position:absolute;inset:0;display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.ready h3{font-size:17px;font-weight:850}
.ready p{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.4}
.minibars{display:flex;gap:6px;margin-top:10px;height:36px;align-items:flex-end}
.minibars i{flex:1;max-width:34px;border-radius:6px;background:var(--track);position:relative;height:100%;overflow:hidden}
.minibars i::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--h);background:var(--c);border-radius:6px;transition:height .9s var(--ease)}
.sec-h{font-size:20px;font-weight:850;letter-spacing:-.02em;margin:6px 2px 12px}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:560px){.mgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.mgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mcard{display:grid;grid-template-columns:54px minmax(0,1fr);gap:14px;align-items:center;text-align:left;padding:16px;border-radius:22px;background:var(--glass);
  border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .35s var(--spring),border-color .3s,box-shadow .3s;min-height:96px}
.mcard::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(closest-side,var(--c20),transparent);transition:transform .5s var(--ease)}
.mcard:hover{border-color:var(--c);box-shadow:var(--shadow)}
.mcard:hover::before{transform:scale(1.4)}
.mcard:active{transform:scale(.97)}
.mcard .ic{width:54px;height:54px;border-radius:17px;background:var(--c20);color:var(--c);display:grid;place-items:center;position:relative}
.mcard .ic svg{width:28px;height:28px}
.mcard b{display:block;font-size:16.5px;font-weight:850;letter-spacing:-.01em;line-height:1.2}
.mcard span{display:block;font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.35}
.mcard .pb{height:5px;border-radius:9px;background:var(--track);margin-top:10px;overflow:hidden}
.mcard .pb i{display:block;height:100%;width:var(--w);background:var(--c);border-radius:9px;transition:width .9s var(--ease)}
.tipcard{margin-top:22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start}
.tipcard img{width:56px;height:56px;border-radius:18px;background:var(--c20,var(--glass));object-fit:contain}
.tipcard p{font-size:15.5px;line-height:1.5;margin:4px 0 12px}
.tipcard .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- module ---------- */
.mod-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;margin:6px 0 16px}
.mod-head .ic{width:58px;height:58px;border-radius:19px;background:var(--c20);color:var(--mc);display:grid;place-items:center}
.mod-head .ic svg{width:30px;height:30px}
.mod-head h2{font-size:clamp(21px,5vw,32px);font-weight:900;letter-spacing:-.03em;line-height:1.08}
.mod-head p{font-size:14px;color:var(--ink2);margin-top:3px;line-height:1.35}
.mod-head .rv{position:relative;width:54px;height:54px}
.mod-head .rv b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900}
.tabs-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.tool{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:860px){.tool{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr)}}
@media (orientation:landscape) and (max-height:540px) and (min-width:700px){.tool{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.out-big{display:flex;align-items:center;gap:16px}
.gauge{position:relative;width:170px;height:150px;flex:0 0 170px;margin:0 auto}
.gauge svg{width:100%;height:100%;overflow:visible}
.gauge .gv{position:absolute;left:0;right:0;top:52px;text-align:center}
.gauge .gv b{display:block;font-size:34px;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gauge .gv small{font-size:12px;color:var(--ink3);font-weight:700}
.level{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-weight:850;font-size:14px;background:var(--lc20);color:var(--lc);transition:background .4s,color .4s}
.level::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--lc);box-shadow:0 0 0 4px var(--lc20)}
.advice{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.advice li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14.5px;line-height:1.45;align-items:start}
.advice li svg{width:20px;height:20px;color:var(--mc);margin-top:1px}
.check-list{list-style:none;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.check{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 8px;border-radius:14px;min-height:52px;text-align:left;width:100%;transition:background .25s}
.check:hover{background:var(--glass)}
.check .bx{width:28px;height:28px;border-radius:9px;border:2px solid var(--line2);display:grid;place-items:center;transition:background .3s,border-color .3s,transform .3s var(--spring)}
.check .bx svg{width:17px;height:17px;color:#fff;opacity:0;transform:scale(.4);transition:opacity .25s,transform .35s var(--spring)}
.check[aria-checked="true"] .bx{background:var(--mc);border-color:var(--mc)}
.check[aria-checked="true"] .bx svg{opacity:1;transform:none}
.check .ct{font-size:14.5px;font-weight:700;line-height:1.3}
.check .ct small{display:block;font-weight:600;color:var(--ink3);font-size:12.5px;margin-top:1px}
.check .qty{font-weight:850;font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
.check[aria-checked="true"] .ct{opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{padding:12px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--line)}
.kpi small{display:block;font-size:12.5px;color:var(--ink3);font-weight:750}
.kpi b{display:block;font-size:22px;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .bar{height:5px;border-radius:9px;background:var(--track);margin-top:8px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--kc,var(--mc));width:var(--w);transition:width .6s var(--ease)}
.canvas-box{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:var(--bg2)}
.canvas-box canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.canvas-box .badge{position:absolute;left:12px;top:12px;padding:6px 12px;border-radius:99px;background:var(--glass2);font-weight:850;font-size:13px;border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.45;margin-top:10px}
.tank{position:relative;width:118px;height:150px;flex:0 0 118px;border-radius:22px 22px 26px 26px;border:3px solid var(--line2);overflow:hidden;background:var(--glass)}
.tank .wl{position:absolute;left:0;right:0;bottom:0;height:100%;transform:translateY(var(--ty,100%));transition:transform 1s var(--ease)}
.tank .wl svg{position:absolute;left:0;top:-10px;width:200%;height:20px;animation:wave 3.2s linear infinite}
.tank .wl::after{content:"";position:absolute;inset:9px 0 0;background:linear-gradient(180deg,var(--mc),#1767c4)}
.tank .tl{position:absolute;left:0;right:0;border-top:2px dashed rgba(229,72,122,.8);top:var(--tt)}
.tank .tl span{position:absolute;right:4px;top:-18px;font-size:10px;font-weight:850;color:#E5487A}
@keyframes wave{to{transform:translateX(-50%)}}
.stack{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--track);margin-top:12px}
.stack i{display:block;height:100%;transition:width .6s var(--ease)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:12.5px;color:var(--ink2);font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend span::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--lc)}
/* city grid */
.palette{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;margin-bottom:6px}
.palette::-webkit-scrollbar{display:none}
.pal{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 8px 6px;border-radius:16px;border:1.5px solid var(--line);min-width:70px;font-size:12px;font-weight:800;color:var(--ink2);transition:border-color .25s,background .25s,transform .25s var(--spring)}
.pal[aria-checked="true"]{border-color:var(--mc);background:var(--c20);color:var(--ink)}
.pal:active{transform:scale(.93)}
.pal .sw{width:34px;height:34px;border-radius:10px}
.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;padding:10px;border-radius:22px;background:var(--bg2);border:1px solid var(--line);touch-action:none;max-width:460px;margin:0 auto;width:100%}
.tile{aspect-ratio:1;border-radius:11px;position:relative;overflow:hidden;transition:transform .3s var(--spring);min-width:0}
.tile:active{transform:scale(.9)}
.tile.pop{animation:tilePop .45s var(--spring)}
@keyframes tilePop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.t-empty,.sw.t-empty{background:repeating-linear-gradient(45deg,rgba(130,140,140,.18) 0 6px,rgba(130,140,140,.10) 6px 12px);box-shadow:inset 0 0 0 1.5px rgba(120,130,130,.25)}
.t-building,.sw.t-building{background:linear-gradient(160deg,#9AA9BF,#5F6F87);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.t-building::after,.t-green::after{content:"";position:absolute;inset:22% 18% 18%;background:repeating-linear-gradient(90deg,rgba(255,240,170,.85) 0 20%,transparent 20% 40%),transparent;
  -webkit-mask:repeating-linear-gradient(180deg,#000 0 18%,transparent 18% 34%);mask:repeating-linear-gradient(180deg,#000 0 18%,transparent 18% 34%)}
.t-green,.sw.t-green{background:linear-gradient(180deg,#46C66F 0 24%,#8FA3B8 24%,#5E7188);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18)}
.t-green::after{inset:36% 18% 16%}
.t-tree,.sw.t-tree{background:radial-gradient(circle at 32% 36%,#58D27B 0 22%,transparent 23%),radial-gradient(circle at 68% 58%,#2EAF5E 0 25%,transparent 26%),radial-gradient(circle at 34% 72%,#3CC067 0 18%,transparent 19%),#1F8A4C}
.t-park,.sw.t-park{background:radial-gradient(circle at 70% 30%,#FFE27A 0 7%,transparent 8%),radial-gradient(circle at 30% 65%,#FF9DBA 0 6%,transparent 7%),linear-gradient(135deg,#9BE38A,#64C873)}
.t-water,.sw.t-water{background:repeating-linear-gradient(170deg,rgba(255,255,255,.35) 0 2px,transparent 2px 9px),linear-gradient(160deg,#5CC8FF,#2479D8)}
.score{display:flex;align-items:center;gap:14px}
.score .rv{position:relative;width:84px;height:84px;flex:0 0 84px}
.score .rv b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:900}
/* solutions */
.sols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media (min-width:860px){.sols{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sol{border-radius:20px;background:var(--glass);border:1px solid var(--line);overflow:hidden;transition:border-color .3s,box-shadow .3s;align-self:start}
.sol[data-open="true"]{border-color:var(--mc);box-shadow:var(--shadow)}
.sol-h{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:10px;padding:14px 16px;width:100%;text-align:left;align-items:start}
.sol-h b{font-size:15.5px;font-weight:850;line-height:1.3;display:block}
.sol-h .chev{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--track);transition:transform .35s var(--ease)}
.sol-h .chev svg{width:16px;height:16px}
.sol[data-open="true"] .chev{transform:rotate(180deg)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tag{font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:7px;background:var(--track);color:var(--ink2)}
.tag.ai{background:rgba(155,140,240,.2);color:#7B66E6}
.tag.hw{background:rgba(46,167,255,.18);color:#1E86D6}
.tag.pr{background:rgba(242,179,54,.22);color:#B9800E}
.tag.nbs{background:rgba(47,203,122,.2);color:#1B9C59}
:root[data-theme="dark"] .tag.ai{color:#B6A9FF}:root[data-theme="dark"] .tag.hw{color:#7CC9FF}:root[data-theme="dark"] .tag.pr{color:#FFD27A}:root[data-theme="dark"] .tag.nbs{color:#7BE7A8}
.tag.seen{background:transparent;border:1px solid var(--line2);color:var(--ink3)}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px;margin-top:10px}
.meter small{display:block;font-size:11.5px;color:var(--ink3);font-weight:750;margin-bottom:4px}
.pips{display:flex;gap:4px}
.pips i{flex:1;height:6px;border-radius:4px;background:var(--track)}
.pips i.on{background:var(--mc)}
.sol-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.sol[data-open="true"] .sol-b{grid-template-rows:1fr}
.sol-b>div{overflow:hidden}
.sol-b dl{padding:0 16px 16px;display:grid;gap:10px}
.sol-b dt{font-size:12px;font-weight:800;color:var(--mc)}
.sol-b dd{font-size:14px;line-height:1.45;margin-top:1px}
.cc{display:flex;gap:5px;flex-wrap:wrap}
.cc span{font-size:11px;font-weight:850;padding:3px 7px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2)}

/* ---------- agent dock / bubble / menu ---------- */
.agent-dock{position:fixed;z-index:40;right:max(10px,calc(var(--sr) + 6px));bottom:calc(var(--nav-h) + var(--sb) + 8px);width:92px;height:108px;
  transition:opacity .35s var(--ease),transform .45s var(--spring)}
.agent-dock .slot{position:absolute;inset:0}
.agent-dock::before{content:"";position:absolute;left:14%;right:14%;bottom:2px;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(69,235,195,.45),transparent)}
.app.on-home~.agent-dock,.agent-dock.away{opacity:0;transform:scale(.4) translateY(30px);pointer-events:none}
@media (orientation:landscape) and (max-height:540px){.agent-dock{bottom:calc(var(--sb) + 6px);width:80px;height:94px}}
@media (min-width:960px) and (min-height:541px){.agent-dock{right:30px;bottom:24px;width:128px;height:148px}}
.bubble{position:fixed;z-index:60;max-width:min(300px,calc(100vw - 24px));padding:12px 14px 13px;border-radius:20px;background:var(--glass2);border:1px solid var(--line2);
  box-shadow:var(--shadow2);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-size:15px;line-height:1.45;font-weight:600;
  opacity:0;transform:scale(.88) translateY(8px);transform-origin:var(--ox,90%) var(--oy,100%);pointer-events:none;transition:opacity .3s var(--ease),transform .4s var(--spring);left:0;top:0}
.bubble.show{opacity:1;transform:none;pointer-events:auto;cursor:pointer}
.bubble .bn,.hero-say .bn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:850;color:var(--accent);margin-bottom:3px}
.bubble .bn .wv,.hero-say .bn .wv{display:inline-flex;gap:2px;height:10px;align-items:flex-end}
.bubble .bn .wv i,.hero-say .bn .wv i{width:2.5px;border-radius:2px;background:var(--accent);height:30%;animation:eq .8s ease-in-out infinite}
.bn .wv i:nth-child(2){animation-delay:.15s}.bn .wv i:nth-child(3){animation-delay:.3s}
.bubble:not(.talking) .bn .wv,.hero-say:not(.talking) .bn .wv{display:none}
@keyframes eq{50%{height:100%}}
.agent-menu{position:fixed;z-index:61;display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:20px;background:var(--glass2);border:1px solid var(--line2);box-shadow:var(--shadow2);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);width:min(230px,calc(100vw - 24px));left:0;top:0;opacity:0;transform:scale(.9);transform-origin:var(--ox,90%) var(--oy,100%);
  transition:opacity .25s,transform .35s var(--spring);pointer-events:none}
.agent-menu.show{opacity:1;transform:none;pointer-events:auto}
.agent-menu button{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:13px;font-weight:750;font-size:14.5px;text-align:left}
.agent-menu button:hover,.agent-menu button:focus-visible{background:var(--track)}
.agent-menu button svg{width:18px;height:18px;color:var(--accent);flex:0 0 18px}

.toast{position:fixed;z-index:70;left:50%;top:calc(var(--st) + var(--top-h) + 6px);transform:translate(-50%,-14px);padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);
  font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--spring);max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- sheet (settings) ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:80;display:flex;align-items:flex-end;justify-content:center;background:var(--scrim);opacity:0;transition:opacity .3s}
.sheet-wrap.show{opacity:1}
.sheet{width:100%;max-height:calc(100% - var(--st) - 20px);overflow-y:auto;overscroll-behavior:contain;background:var(--solid);border-radius:28px 28px 0 0;
  padding:8px max(18px,var(--sr)) calc(22px + var(--sb)) max(18px,var(--sl));transform:translateY(40px);transition:transform .45s var(--spring);box-shadow:var(--shadow2)}
.sheet-wrap.show .sheet{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 6px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--solid);padding:8px 0 10px;z-index:2}
.sheet-head h2{font-size:22px;font-weight:900;letter-spacing:-.02em}
.sgroup{padding:12px 0;border-top:1px solid var(--line)}
.sgroup>h3{font-size:13px;font-weight:850;color:var(--ink3);margin-bottom:6px}
.agents{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.agent-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:18px;border:2px solid var(--line);transition:border-color .25s,background .25s,transform .3s var(--spring);min-width:0}
.agent-opt img{width:64px;height:64px;object-fit:contain}
.agent-opt b{font-size:13.5px;font-weight:850}
.agent-opt small{font-size:11.5px;color:var(--ink3);font-weight:700}
.agent-opt[aria-checked="true"]{border-color:var(--accent);background:rgba(69,235,195,.1)}
.agent-opt:active{transform:scale(.94)}
select{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line2);background:var(--glass);padding:0 12px;font-weight:650;font-size:15px}
.warn{font-size:13px;color:#C9711B;background:rgba(242,179,54,.14);border-radius:12px;padding:10px 12px;line-height:1.4;margin-top:8px}
@media (min-width:720px) and (min-height:541px){
  .sheet-wrap{align-items:center}
  .sheet{width:min(580px,92vw);max-height:86vh;border-radius:28px;padding:10px 24px 24px}
  .sheet .grab{display:none}
}
@media (orientation:landscape) and (max-height:540px){
  .sheet-wrap{align-items:center}
  .sheet{width:min(600px,calc(100% - var(--sl) - var(--sr) - 24px));max-height:calc(100% - var(--st) - var(--sb) - 16px);border-radius:22px;padding:6px 20px 16px}
  .sheet .grab{display:none}
  .agents{grid-template-columns:repeat(6,minmax(0,1fr))}
  .agent-opt img{width:52px;height:52px}
}

/* ---------- tour ---------- */
.tour{position:fixed;inset:0;z-index:90}
.tour-hole{position:absolute;border-radius:18px;box-shadow:0 0 0 200vmax var(--scrim),0 0 0 3px var(--accent),0 0 28px 4px rgba(69,235,195,.55);
  transition:left .45s var(--ease),top .45s var(--ease),width .45s var(--ease),height .45s var(--ease);pointer-events:none}
.tour-card{position:absolute;width:min(340px,calc(100vw - 24px - var(--sl) - var(--sr)));padding:16px;border-radius:22px;background:var(--solid);border:1px solid var(--line2);box-shadow:var(--shadow2);
  transition:left .45s var(--ease),top .45s var(--ease),opacity .3s;max-height:calc(100% - var(--st) - var(--sb) - 20px);overflow-y:auto}
.tour-card .who{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.tour-card .who img{width:40px;height:40px;object-fit:contain;border-radius:12px;background:var(--glass)}
.tour-card .who b{font-size:14px;font-weight:850;display:block}
.tour-card .who small{font-size:12px;color:var(--ink3);font-weight:750}
.tour-card p{font-size:15.5px;line-height:1.5;font-weight:600}
.tour-card .tacts{display:flex;align-items:center;gap:8px;margin-top:14px}
.tour-card .tacts .sp{flex:1}
.dots{display:flex;gap:5px;margin-left:auto}
.dots i{width:6px;height:6px;border-radius:9px;background:var(--line2);transition:width .3s,background .3s}
.dots i.on{width:16px;background:var(--accent)}

/* ---------- welcome ---------- */
.welcome{position:fixed;inset:0;z-index:100;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;transition:opacity .5s var(--ease),transform .6s var(--ease)}
.welcome.out{opacity:0;transform:scale(1.04);pointer-events:none}
.welcome .bgfx{position:fixed}
.wl{position:relative;z-index:1;min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:6px;
  padding:calc(var(--st) + 14px) max(18px,var(--sr)) calc(var(--sb) + 18px) max(18px,var(--sl));max-width:980px;margin:0 auto}
.wl-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wl-brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.02em}
.wl-brand .brand-mark{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 200deg,#2FCB7A,#2EA7FF,#9B8CF0,#FF7B4A,#F2B336,#2FCB7A);display:grid;place-items:center}
.wl-brand .brand-mark span{width:15px;height:15px;border-radius:50%;background:var(--bg)}
.wl-stagewrap{position:relative;display:grid;grid-template-columns:48px minmax(0,1fr) 48px;align-items:center;min-height:220px}
.wl-stage{height:100%;min-height:220px;max-height:340px;touch-action:none}
.wl-arrow{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line2);transition:transform .25s var(--spring)}
.wl-arrow:active{transform:scale(.88)}
.wl-arrow svg{width:22px;height:22px}
.wl-info{text-align:center}
.wl-info h1{font-size:clamp(28px,7.5vw,44px);font-weight:900;letter-spacing:-.035em;line-height:1.05}
.wl-info p{font-size:15px;color:var(--ink2);margin:8px auto 0;max-width:40ch;line-height:1.45}
.wl-name{margin-top:12px;font-size:20px;font-weight:900}
.wl-name small{display:block;font-size:13px;color:var(--ink3);font-weight:750}
.wl-thumbs{display:flex;justify-content:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.wl-thumbs button{width:50px;height:50px;border-radius:15px;border:2px solid var(--line);display:grid;place-items:center;background:var(--glass);transition:border-color .25s,transform .3s var(--spring)}
.wl-thumbs button img{width:42px;height:42px;object-fit:contain}
.wl-thumbs button[aria-checked="true"]{border-color:var(--accent);transform:translateY(-3px)}
.wl-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.wl-btns .btn{min-width:170px}
.wl-left{display:flex;flex-direction:column;min-height:0}
@media (orientation:landscape) and (max-height:540px){

const mix=(a,b,f)=>{const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=s=>Math.round(((A>>s)&255)*(1-f)+((B>>s)&255)*f);return`rgb(${c(16)},${c(8)},${c(0)})`};
function hazeScene(cv){const ctx=cv.getContext('2d');let raf=0,W=0,H=0,dpr=1,f=clamp(S.haze.v/350,0,1);const t0=performance.now();
 const fit=()=>{dpr=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)};
 const ro=new ResizeObserver(fit);ro.observe(cv);fit();
 const P=Array.from({length:170},()=>({x:Math.random(),y:Math.random(),r:.6+Math.random()*2.2,v:.0006+Math.random()*.0012,p:Math.random()*6}));
 const sky=[[.04,.2,.09],[.13,.32,.07],[.2,.15,.06],[.27,.42,.08],[.36,.26,.07],[.44,.5,.06],[.51,.3,.09],[.61,.38,.07],[.69,.22,.08],[.78,.46,.06],[.86,.3,.08],[.94,.2,.07]];

  const dark=document.documentElement.dataset.theme==='dark';ctx.setTransform(dpr,0,0,dpr,0,0);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,dark?mix('#0E3550','#3A3122',f):mix('#7CCBF0','#C2AE86',f));g.addColorStop(1,dark?mix('#15435A','#4A4030',f):mix('#D8F1FA','#E3D7BB',f));ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.globalAlpha=1-f*.8;ctx.fillStyle=dark?'#FFF2C6':'#FFD45E';ctx.beginPath();ctx.arc(W*.78,H*.24,Math.min(W,H)*.075,0,7);ctx.fill();ctx.globalAlpha=1;
  const by=H*.84;for(const[x,h,w] of sky){ctx.fillStyle=dark?mix('#2A4A5E','#4B4334',f):mix('#6C88A3','#A29270',f);ctx.fillRect(x*W-w*W/2,by-h*H,w*W,h*H)}
  ctx.fillStyle=dark?mix('#1F5E46','#3E3A2A',f):mix('#4FBF78','#97A06E',f);ctx.fillRect(0,by,W,H-by);
  const n=Math.round(14+f*156);for(let i=0;i<n;i++){const p=P[i];p.x+=p.v;if(p.x>1.02)p.x=-.02;const y=p.y*H+Math.sin(tt*.8+p.p)*6;
   ctx.fillStyle=dark?`rgba(220,200,160,${.18+f*.35})`:`rgba(110,90,60,${.14+f*.32})`;ctx.beginPath();ctx.arc(p.x*W,y,p.r*(1+f*.6),0,7);ctx.fill()}
  const fg=ctx.createLinearGradient(0,0,0,H);fg.addColorStop(0,`rgba(200,180,140,${f*.25})`);fg.addColorStop(1,`rgba(200,180,140,${f*.6})`);ctx.fillStyle=fg;ctx.fillRect(0,0,W,H)}
 raf=requestAnimationFrame(draw);return()=>{cancelAnimationFrame(raf);ro.disconnect()}}

/* ---------- agent speech ---------- */
function anchorRect(){const B=App.buddy,c=B&&B.slot;if(!c)return null;const r=c.getBoundingClientRect();if(!r.width)return null;return r}
function bounds(){const I=App.insets(),top=$('.topbar').getBoundingClientRect().bottom+6,nav=$('#nav').getBoundingClientRect();const horiz=nav.width>nav.height;
 return{t:Math.max(top,I.t+6),b:(horiz?nav.top:innerHeight-I.b)-6,l:Math.max(8,I.l+8,horiz?0:nav.right+8),r:innerWidth-Math.max(8,I.r+8)}}
function placeFloat(el,A){const w=el.offsetWidth,h=el.offsetHeight,B=bounds(),cx=A.left+A.width/2;let x,y,ox,oy;
 const left=clamp(cx-w*.72,B.l,B.r-w);
 if(A.top-10-h>=B.t){x=left;y=A.top-10-h;oy='100%'}
 else if(A.left-10-w>=B.l){x=A.left-10-w;y=clamp(A.top+A.height/2-h/2,B.t,B.b-h);ox='100%';oy='50%'}
 else{x=left;y=clamp(A.bottom+10,B.t,B.b-h);oy='0%'}
 ox=ox||((clamp(cx-x,0,w)/w*100).toFixed(0)+'%');el.style.left=Math.round(x)+'px';el.style.top=Math.round(y)+'px';el.style.setProperty('--ox',ox);el.style.setProperty('--oy',oy)}
let typeT=0,hideT=0;
function sayTarget(){return App.view==='home'?$('#heroSay'):$('#bubble')}
App.say=function(text,{voice=true}={}){if(Tour.on)return;closeMenu();const id=++App.sayId;const B=App.buddy;const el=sayTarget();if(!el)return;
 const other=el.id==='bubble'?$('#heroSay'):$('#bubble');if(other)other.classList.remove('show','talking');
 clearTimeout(hideT);clearInterval(typeT);el.innerHTML=`<div class="bn">${esc(agentName())}<span class="wv"><i></i><i></i><i></i></span></div><div class="bt"></div>`+(el.id==='bubble'?`<button class="bx-close" aria-label="${esc(t('close'))}">${ICON.x}</button>`:'');
 const bt=el.querySelector('.bt');el.classList.add('show');if(el.id==='heroSay'&&B)B.shift=1;
 const chars=[...text];let n=0;const sp=S.lang==='zh'?55:22;const reduce=S.reduce||mqRM.matches;
 if(reduce)bt.textContent=text;else{typeT=setInterval(()=>{n+=2;bt.textContent=chars.slice(0,n).join('');if(n>=chars.length)clearInterval(typeT)},sp)}
 if(el.id==='bubble'){bt.textContent=text;el.style.visibility='hidden';const A=anchorRect();el.style.visibility='';if(A)placeFloat(el,A);if(!reduce)bt.textContent=''}
 const end=()=>{if(id!==App.sayId)return;if(B)B.st.talk=false;Snd.setDuck(false);el.classList.remove('talking');clearTimeout(hideT);hideT=setTimeout(()=>{if(id===App.sayId)hideSay()},2600)};
 const started=()=>{if(B)B.st.talk=true;Snd.setDuck(true);el.classList.add('talking')};
 if(voice&&S.voice&&Voice.ok&&Voice.forLang(S.lang).length){Voice.speak(text,{lang:S.lang,name:S.voiceName[S.lang],rate:S.voiceRate,vol:S.voiceVol,onstart:started,onend:end})}
 else{started();setTimeout(end,Math.max(1600,chars.length*(S.lang==='zh'?150:60)))}};
function hideSay(stopVoice){App.sayId++;clearInterval(typeT);clearTimeout(hideT);$('#bubble').classList.remove('show','talking');const hs=$('#heroSay');if(hs)hs.classList.remove('show','talking');
 if(App.buddy){App.buddy.shift=0;App.buddy.st.talk=false}Snd.setDuck(false);if(stopVoice)Voice.cancel()}
function speakOnly(text){if(!(S.voice&&Voice.ok&&Voice.forLang(S.lang).length)){const B=App.buddy;if(B){B.st.talk=true;setTimeout(()=>B.st.talk=false,Math.max(1500,text.length*(S.lang==='zh'?140:55)))}return}
 const B=App.buddy;Voice.speak(text,{lang:S.lang,name:S.voiceName[S.lang],rate:S.voiceRate,vol:S.voiceVol,onstart:()=>{if(B)B.st.talk=true;Snd.setDuck(true)},onend:()=>{if(B)B.st.talk=false;Snd.setDuck(false)}})}

function openMenu(){const m=$('#agentMenu');m.innerHTML=[['tip','spark','menuTip'],['explain','help','menuExplain'],['tour','map','menuTour'],['buddy','swap','menuBuddy'],['quiet','hush','menuQuiet']]
 .map(([a,i,l])=>`<button data-m="${a}" role="menuitem">${ICON[i]}${t(l)}</button>`).join('');m.hidden=false;const A=anchorRect();if(A){const B=App.buddy;const c={left:A.left+A.width*.25,width:A.width*.5,top:A.top+A.height*.1,height:A.height*.8,bottom:A.top+A.height*.9};placeFloat(m,c)}

function closeMenu(){const m=$('#agentMenu');if(m.hidden)return;m.classList.remove('show');setTimeout(()=>{if(!m.classList.contains('show'))m.hidden=true},260)}
function menuAction(a){closeMenu();const mod=App.view;
 if(a==='tip'){const pool=mod==='home'?MODULES.flatMap(m=>t('tips')[m.id]):t('tips')[mod];App.say(pool[Math.floor(Math.random()*pool.length)])}
 if(a==='explain')App.say(mod==='home'?t('explain').home:t('explain')[(App.tab[mod]||'tool')==='tool'?'tool':'sol']);
 if(a==='tour')Tour.start();if(a==='buddy')openSettings('buddy');if(a==='quiet'){hideSay(true);Snd.sfx('close')}}

/* ---------- toast ---------- */
let toastT;function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1800)}

/* ---------- settings ---------- */
function settingsHTML(){const vs=Voice.ok?Voice.ranked(S.lang):[];
 return`<div class="grab"></div><div class="sheet-head"><h2 id="setTitle">${t('settings')}</h2><button class="icon-btn" data-s="close" aria-label="${t('close')}">${ICON.x}</button></div>
 <div class="sgroup"><h3>${t('language')}</h3><div class="seg" style="width:100%">${[['en','English'],['zh','华语']].map(([k,l])=>`<button style="flex:1" data-s="lang" data-v="${k}" aria-pressed="${S.lang===k}" lang="${k==='zh'?'zh-Hans':'en'}">${l}</button>`).join('')}</div></div>
 <div class="sgroup"><h3>${t('theme')}</h3><div class="seg" style="width:100%">${['light','dark','auto'].map(k=>`<button style="flex:1" data-s="theme" data-v="${k}" aria-pressed="${S.theme===k}">${t(k)}</button>`).join('')}</div></div>
 <div class="sgroup" id="setBuddy"><h3>${t('buddy')}</h3><div class="agents" role="radiogroup">${AGENTS.map(a=>`<button class="agent-opt" role="radio" data-s="agent" data-v="${a.id}" aria-checked="${S.agent===a.id}">${App.thumbs[a.id]?`<img src="${App.thumbs[a.id]}" alt="">`:`<span style="font-size:40px">${a.emoji}</span>`}<b>${L(a.name)}</b><small>${L(a.sp)}</small></button>`).join('')}</div></div>
 <div class="sgroup"><h3>${t('sound')}</h3>${swRow('sMusic',t('music'),S.music)}${rng('sMusicV',t('vol'),0,1,.05,S.musicVol,Math.round(S.musicVol*100)+'%')}
 ${swRow('sSfx',t('sfx'),S.sfx)}${rng('sSfxV',t('vol'),0,1,.05,S.sfxVol,Math.round(S.sfxVol*100)+'%')}
 ${swRow('sVoice',t('voice'),S.voice,t('voiceHint'))}${Voice.ok&&vs.length?`<div class="field"><label class="lbl" for="sVoiceN">${t('voicePick')}</label><select id="sVoiceN"><option value="">${t('voiceAuto')}</option>${vs.map(v=>`<option value="${esc(v.name)}" ${S.voiceName[S.lang]===v.name?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>`:`<p class="warn">${t('noVoice')}</p>`}
 ${rng('sRate',t('voiceRate'),.7,1.3,.05,S.voiceRate,fmt(S.voiceRate,2)+'×')}${rng('sVoiceV',t('vol'),0,1,.05,S.voiceVol,Math.round(S.voiceVol*100)+'%')}
 <button class="btn ghost sm" data-s="test" style="margin-top:6px">${ICON.speak}${t('voiceTest')}</button></div>
 <div class="sgroup"><h3>${t('general')}</h3>${swRow('sRm',t('motion'),S.reduce,t('motionHint'))}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px"><button class="btn ghost" data-s="tour">${ICON.map}${t('tour')}</button><button class="btn danger" data-s="reset">${t('reset')}</button></div></div>`}
let lastFocus=null;
function openSettings(section){closeMenu();lastFocus=document.activeElement;const w=$('#settings');$('#sheet').innerHTML=settingsHTML();w.hidden=false;requestAnimationFrame(()=>w.classList.add('show'));Snd.sfx('open');
 setTimeout(()=>{if(section==='buddy'){const b=$('#setBuddy');b&&b.scrollIntoView({block:'start',behavior:'smooth'})}const c=$('[data-s="close"]');c&&c.focus({preventScroll:true})},120)}
function closeSettings(){const w=$('#settings');if(w.hidden)return;w.classList.remove('show');Snd.sfx('close');setTimeout(()=>{if(!w.classList.contains('show'))w.hidden=true},320);lastFocus&&lastFocus.focus&&lastFocus.focus({preventScroll:true})}
function refreshSettings(){const w=$('#settings');if(w.hidden)return;const sh=$('#sheet'),st=sh.scrollTop;sh.innerHTML=settingsHTML();sh.scrollTop=st}
App.onVoices=()=>refreshSettings();
let resetArm=0;
function settingsClick(e){const b=e.target.closest('[data-s],.switch');if(!b)return;
 if(b.classList.contains('switch')){const map={sMusic:'music',sSfx:'sfx',sVoice:'voice',sRm:'reduce'},k=map[b.id];if(!k)return;S[k]=!S[k];b.setAttribute('aria-checked',S[k]);
  if(k==='music'||k==='sfx'){Snd.on.music=S.music;Snd.on.sfx=S.sfx;Snd.init();Snd.apply();renderTop()}if(k==='voice'&&!S.voice)hideSay(true);if(k==='reduce')applyMotion();Snd.sfx(S[k]?'on':'off');save();return}
 const a=b.dataset.s,v=b.dataset.v;
 if(a==='close')closeSettings();
 if(a==='lang'&&S.lang!==v)setLang(v);
 if(a==='theme'){S.theme=v;applyTheme();Snd.sfx('tap');refreshSettings();save()}
 if(a==='agent'&&S.agent!==v)setAgent(v,true);
 if(a==='test'){Snd.init();if(App.view!=='home'||true){const s=t('hi',{name:agentName()});closeSettings();setTimeout(()=>App.say(s),340)}}
 if(a==='tour'){closeSettings();setTimeout(()=>Tour.start(),340)}
 if(a==='reset'){const now=Date.now();if(now-resetArm<3000){const keep={lang:S.lang,theme:S.theme,agent:S.agent,music:S.music,sfx:S.sfx,voice:S.voice,musicVol:S.musicVol,sfxVol:S.sfxVol,voiceVol:S.voiceVol,voiceRate:S.voiceRate,voiceName:S.voiceName,reduce:S.reduce,onboarded:true};
  S=Object.assign(clone(DEF),keep);S.city.g=presetGrid('start');save();resetArm=0;toast(t('resetDone'));Snd.sfx('off');render(false);refreshSettings()}else{resetArm=now;toast(t('resetConfirm'));Snd.sfx('warn')}}}
function settingsInput(e){const r=e.target;if(r.type==='range'){r.style.setProperty('--pct',pctOf(r));const v=+r.value,o=$('#'+r.id+'-o');
  if(r.id==='sMusicV'){S.musicVol=v;Snd.vol.music=v;Snd.apply()}if(r.id==='sSfxV'){S.sfxVol=v;Snd.vol.sfx=v;Snd.apply();Snd.tick2()}if(r.id==='sVoiceV')S.voiceVol=v;if(r.id==='sRate')S.voiceRate=v;
  if(o)o.textContent=r.id==='sRate'?fmt(v,2)+'×':Math.round(v*100)+'%';save()}
 if(r.id==='sVoiceN'){S.voiceName[S.lang]=r.value;save()}}

function setLang(l){S.lang=l;save();document.documentElement.lang=l==='zh'?'zh-Hans':'en';hideSay(true);render(false);refreshSettings();renderWelcome();if(Tour.on)Tour.show();Snd.sfx('on');
 setTimeout(()=>App.say(t('langSwitched')),120)}
function setAgent(id,talk){S.agent=id;save();if(App.buddy){App.buddy.setChar(id);App.buddy.emote('hop')}Snd.sfx('boing');refreshSettings();renderWelcome(true);
 const img=$('.tipcard img');if(img&&App.thumbs[id]){img.src=App.thumbs[id];img.hidden=false;const h=$('.tipcard h3');if(h)h.textContent=t('tipFrom',{name:agentName()})}
 if(talk&&$('#settings').hidden)App.say(t('hi',{name:agentName()}))}

/* ---------- tour ---------- */
const Tour={on:false,i:0,steps:[null,'#nav','#moduleGrid','#readyCard','#btnLang','#btnTheme','#btnSettings','#heroStage'],
 start(){closeMenu();closeSettings();hideSay(true);if(App.view!=='home')go('home',{quiet:true});this.on=true;this.i=0;$('#tour').hidden=false;Snd.sfx('open');this.show()},
 target(){const s=this.steps[this.i];return s?$(s):null},
 show(){const el=this.target(),main=$('#main');const rm=S.reduce||mqRM.matches;
  if(el&&main.contains(el)){const mr=main.getBoundingClientRect(),r=el.getBoundingClientRect();const off=r.top-mr.top+main.scrollTop-(this.i===2?8:Math.max(8,(mr.height-r.height)/2));
   main.scrollTo({top:Math.max(0,off),behavior:rm?'auto':'smooth'})}
  this.card();this.layout();const t0=performance.now(),loop=()=>{if(!this.on)return;this.layout();if(performance.now()-t0<1100)this._raf=requestAnimationFrame(loop)};cancelAnimationFrame(this._raf);this._raf=requestAnimationFrame(loop);speakOnly(t('tourSteps')[this.i].split('{name}').join(agentName()))},
 card(){const n=this.steps.length,last=this.i===n-1,a=agentOf();
  $('#tourCard').innerHTML=`<div class="who">${App.thumbs[a.id]?`<img src="${App.thumbs[a.id]}" alt="">`:''}<div><b>${esc(L(a.name))}</b><small>${this.i+1} / ${n}</small></div><div class="dots" aria-hidden="true">${this.steps.map((_,k)=>`<i class="${k===this.i?'on':''}"></i>`).join('')}</div></div>
  <p id="tourText">${esc(t('tourSteps')[this.i].split('{name}').join(L(a.name)))}</p>
  <div class="tacts">${this.i>0?`<button class="btn sm ghost" data-t="back">${t('back')}</button>`:''}<button class="btn sm ghost" data-t="skip">${t('skip')}</button><span class="sp"></span><button class="btn sm primary" data-t="next">${last?t('finish'):t('next')}</button></div>`;
  setTimeout(()=>{const b=$('[data-t="next"]');b&&b.focus({preventScroll:true})},30)},
 layout(){if(!this.on)return;const el=this.target(),hole=$('#tourHole'),card=$('#tourCard'),I=App.insets(),vw=innerWidth,vh=innerHeight;let R;
  if(el){const r=el.getBoundingClientRect();let top=r.top,bot=r.bottom;const main=$('#main');if(main.contains(el)){const mr=main.getBoundingClientRect();top=Math.max(top,mr.top+4);bot=Math.min(bot,mr.bottom-4)}
   const pad=6;R={l:Math.max(2,r.left-pad),t:Math.max(2,top-pad),r:Math.min(vw-2,r.right+pad),b:Math.min(vh-2,bot+pad)}}
  else R={l:vw/2,t:vh*.42,r:vw/2,b:vh*.42};
  Object.assign(hole.style,{left:R.l+'px',top:R.t+'px',width:(R.r-R.l)+'px',height:(R.b-R.t)+'px',opacity:el?1:0});
  const w=card.offsetWidth,h=card.offsetHeight,minT=I.t+10,maxB=vh-I.b-10;let y;
  if(!el)y=(vh-h)/2;else if(R.b+12+h<=maxB)y=R.b+12;else if(R.t-12-h>=minT)y=R.t-12-h;else y=maxB-h;
  const cx=el?(R.l+R.r)/2:vw/2;const x=clamp(cx-w/2,Math.max(12,I.l+12),vw-w-Math.max(12,I.r+12));card.style.left=Math.round(x)+'px';card.style.top=Math.round(clamp(y,minT,maxB-h))+'px'},
 next(){if(this.i>=this.steps.length-1){this.end(true);return}this.i++;Snd.sfx('tap');this.show()},
 back(){if(this.i>0){this.i--;Snd.sfx('tap');this.show()}},
 end(done){this.on=false;$('#tour').hidden=true;Voice.cancel();if(App.buddy)App.buddy.st.talk=false;Snd.setDuck(false);if(done){Snd.sfx('success');App.buddy&&App.buddy.emote('spin')}else Snd.sfx('close');$('#main').scrollTo({top:0,behavior:'smooth'})}};

/* ---------- welcome ---------- */
function renderWelcome(keepStage){const w=$('#welcome');if(w.hidden)return;const a=agentOf();
 $('#wlH').textContent=t('welcomeH');$('#wlP').textContent=t('welcomeP');$('#wlName').innerHTML=`${esc(L(a.name))}<small>${esc(L(a.sp))}</small>`;
 $('#wlStart').textContent=t('startTour');$('#wlSkip').textContent=t('skipTour');$('#wlPrev').setAttribute('aria-label',t('prevBuddy'));$('#wlNext').setAttribute('aria-label',t('nextBuddy'));
 $$('#wlLang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.lang));
 $('#wlThumbs').innerHTML=AGENTS.map(x=>`<button role="radio" aria-checked="${x.id===S.agent}" data-a="${x.id}" aria-label="${esc(L(x.name)+', '+L(x.sp))}">${App.thumbs[x.id]?`<img src="${App.thumbs[x.id]}" alt="">`:`<span style="font-size:28px">${x.emoji}</span>`}</button>`).join('')}
function cycleAgent(d){const i=AGENTS.findIndex(a=>a.id===S.agent);setAgent(AGENTS[(i+d+AGENTS.length)%AGENTS.length].id,false)}
function finishWelcome(tour){Snd.init();Snd.apply();S.onboarded=true;save();const w=$('#welcome');w.classList.add('out');
 setTimeout(()=>{w.hidden=true},560);App.view='home';render(false);
 if(tour)Tour.start();else{App.introduced.add('home');setTimeout(()=>App.say(t('hi',{name:agentName()})),380)}}

/* ---------- init ---------- */
function init(){App.probe=document.createElement('div');App.probe.style.cssText='position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)';document.body.appendChild(App.probe);
 document.documentElement.lang=S.lang==='zh'?'zh-Hans':'en';applyTheme();
 Snd.on.music=S.music;Snd.on.sfx=S.sfx;Snd.vol.music=S.musicVol;Snd.vol.sfx=S.sfxVol;
 const B=App.buddy=new Buddy();applyMotion();B.setChar(S.agent);B.onTap=()=>{Snd.sfx('pop');const m=$('#agentMenu');if(!m.hidden&&m.classList.contains('show'))closeMenu();else openMenu()};
 App.thumbs=B.thumbs(AGENTS.map(a=>a.id));
 // first gesture unlocks audio
 const unlock=()=>{Snd.init();Snd.apply()};document.addEventListener('pointerdown',unlock,{once:true,capture:true});document.addEventListener('keydown',unlock,{once:true,capture:true});
 // chrome events
 $('#navItems').addEventListener('click',e=>{const b=e.target.closest('[data-nav]');if(b)go(b.dataset.nav)});
 $('#btnLang').addEventListener('click',()=>setLang(S.lang==='zh'?'en':'zh'));
 $('#btnTheme').addEventListener('click',()=>{const cur=document.documentElement.dataset.theme;S.theme=cur==='dark'?'light':'dark';applyTheme();Snd.sfx(S.theme==='dark'?'off':'on');save();refreshSettings()});
 $('#btnSound').addEventListener('click',()=>{S.music=!S.music;Snd.on.music=S.music;Snd.init();Snd.apply();renderTop();toast(S.music?t('musicOn'):t('musicOff'));Snd.sfx(S.music?'on':'off');save();refreshSettings()});
 $('#btnSettings').addEventListener('click',()=>openSettings());
 $('#settings').addEventListener('click',e=>{if(e.target.id==='settings')closeSettings()});$('#sheet').addEventListener('click',settingsClick);$('#sheet').addEventListener('input',settingsInput);$('#sheet').addEventListener('change',settingsInput);
 $('#agentMenu').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){Snd.sfx('tap');menuAction(b.dataset.m)}});
 $('#bubble').addEventListener('click',()=>{hideSay(true)});
 document.addEventListener('pointerdown',e=>{const bb=$('#bubble');if(bb.classList.contains('show')&&!bb.contains(e.target)&&!(App.buddy&&e.target===App.buddy.canvas))bb.classList.remove('show');},true);
 document.addEventListener('pointerdown',e=>{const m=$('#agentMenu');if(!m.hidden&&!m.contains(e.target)&&!(App.buddy&&e.target===App.buddy.canvas))closeMenu()},true);
 $('#view').addEventListener('click',e=>{const hs=e.target.closest('#heroSay');if(hs){hideSay(true);return}const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=App.view;
  if(a==='go')go(b.dataset.id);if(a==='tour')Tour.start();
  if(a==='tab'){App.tab[id]=b.dataset.v;$$('[data-act="tab"]').forEach(x=>x.setAttribute('aria-selected',x===b));Snd.sfx('tap');mountBody(id);hideSay(true)}
  if(a==='filter'){App.filter[id]=b.dataset.v;Snd.sfx('tap');$('#modBody').innerHTML=solHTML(id)}
  if(a==='sol'){const i=+b.dataset.i,art=b.closest('.sol'),op=art.dataset.open!=='true';App.open[id]=App.open[id]||{};App.open[id][i]=op;art.dataset.open=op;b.setAttribute('aria-expanded',op);Snd.sfx(op?'open':'close');
   if(op&&!S.seen[id].includes(i)){S.seen[id].push(i);save();refreshProg(id);const tg=b.querySelector('.tags');if(tg&&!tg.querySelector('.seen'))tg.insertAdjacentHTML('beforeend',`<span class="tag seen">${t('seen')}</span>`);
    const n=$('#seenN');if(n)n.textContent=`${S.seen[id].length}/${SOL[id].length}`;if(S.seen[id].length===SOL[id].length){Snd.sfx('success');App.buddy.emote('happy');App.say(t('tapLines')[6])}}}
  if(a==='tipRead'){App.say($('#tipText').textContent)}
  if(a==='tipNext'){App.tipI++;const tips=MODULES.flatMap(m=>t('tips')[m.id]);$('#tipText').textContent=tips[App.tipI%tips.length];Snd.sfx('tap')}});
 $('#tour').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;const k=b.dataset.t;if(k==='next')Tour.next();if(k==='back')Tour.back();if(k==='skip')Tour.end(false)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(Tour.on)Tour.end(false);else if(!$('#settings').hidden)closeSettings();else closeMenu()}
  if(Tour.on&&(e.key==='ArrowRight'))Tour.next();if(Tour.on&&e.key==='ArrowLeft')Tour.back();
  if(!$('#settings').hidden&&e.key==='Tab'){const f=$$('#sheet button,#sheet input,#sheet select').filter(x=>!x.disabled&&x.offsetParent);if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){z.focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===z){a.focus();e.preventDefault()}}});
 let rT;const onResize=()=>{clearTimeout(rT);rT=setTimeout(()=>{if(Tour.on)Tour.layout();const b=$('#bubble');if(b.classList.contains('show')){const A=anchorRect();if(A)placeFloat(b,A)}closeMenu()},120)};
 addEventListener('resize',onResize);addEventListener('orientationchange',onResize);
 $('#main').addEventListener('scroll',()=>{const bb=$('#bubble');if(bb.classList.contains('show')&&$('#main').scrollTop>30&&!App._sayFresh)bb.classList.remove('show');if(Tour.on){clearTimeout(Tour._s);Tour._s=setTimeout(()=>Tour.layout(),60)}},{passive:true});
 // welcome
 const w=$('#welcome');
 $('#wlLang').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.v!==S.lang){S.lang=b.dataset.v;save();document.documentElement.lang=S.lang==='zh'?'zh-Hans':'en';renderWelcome();Snd.sfx('on');speakOnly(t('welcomeH'))}});
 $('#wlPrev').addEventListener('click',()=>cycleAgent(-1));$('#wlNext').addEventListener('click',()=>cycleAgent(1));
 $('#wlThumbs').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&b.dataset.a!==S.agent)setAgent(b.dataset.a,false)});
 $('#wlStart').addEventListener('click',()=>finishWelcome(true));$('#wlSkip').addEventListener('click',()=>finishWelcome(false));
 renderNav();renderTop();
 if(!S.onboarded){w.hidden=false;renderWelcome();B.attach($('#wlStage'),{drag:true});App.view='home';render(false);B.attach($('#wlStage'),{drag:true})}
 else{w.hidden=true;render(false);App.introduced.add('home')}
 document.body.classList.add('ready')}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();
</script>
